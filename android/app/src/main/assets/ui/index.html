<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="back" data-act="back" hidden aria-label="Назад"><svg class="i"><use href="#i-back"/></svg></button>
    <div class="brand" id="brand"><img class="brand-mark" src="monogram.svg" alt=""><span>VEDOMYJ VPN</span></div>
    <h1 class="top-title" id="title" hidden></h1>
    <span class="grow"></span>
    <button class="icon-btn warn" id="problems" data-act="problems" hidden aria-label="Проблемы"><svg class="i"><use href="#i-alert"/></svg></button>
    <button class="icon-btn" id="settingsBtn" data-nav="settings" aria-label="Настройки"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>
  <main class="view" id="view"></main>
</div>

<div class="sheet-back" id="sheetBack" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

<script src="i18n.js"></script>
