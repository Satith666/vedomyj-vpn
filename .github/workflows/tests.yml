# Самопроверка при каждом изменении: программа для ПК (на Linux — всё, что не зависит от Windows) и ядро
# Android-версии. Итог — зелёная или красная галочка у коммита на GitHub; что именно сломалось — в логе запуска.
name: Самопроверка

on:
  workflow_dispatch:
  pull_request:
  push:
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

jobs:
  pc:
    name: Программа для ПК
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Самопроверка
        run: python3 -m pult.selftest

      - name: Изменения версии описаны
        run: |
          VER=$(python3 -c "import pult; print(pult.APP_VERSION)")
          python3 build/changelog_notes.py "$VER" --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Окно программы в настоящем браузере
        run: |
          npm install --no-save --no-audit --no-fund playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          UI_SERVER_SECONDS=360 python3 build/ui_server.py > ui_server.log 2>&1 &
          for i in $(seq 1 90); do grep -q '"port"' ui_server.log && break; sleep 1; done
          PORT=$(python3 -c "import json; print([json.loads(l) for l in open('ui_server.log') if l.startswith('{')][-1]['port'])")
          node build/ui_check.js "$PORT"

  server:
    name: Свой сервер на настоящем Linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Скрипт мастера, подключение к своему серверу и мост
        run: sudo python3 build/server_check.py

      - name: Опыт — свой протокол (только для сведения)
        if: always()
        run: python3 build/proto_lab.py /usr/local/bin/xray

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Браузер для проверки интерфейса
        run: |
          cd android/coretest
          npm install --no-save --no-audit --no-fund playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Самопроверка ядра и сверка с программой для ПК
        run: |
          set -o pipefail
          sh android/coretest/run.sh 2>&1 | tee coretest.log

      - name: Ошибки — на страницу запуска
        if: failure()
        run: |
          grep -A4 "FAIL" coretest.log | head -60 > fails.txt || true
          echo "::error title=Android::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' fails.txt)"
